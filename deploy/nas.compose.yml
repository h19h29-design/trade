name: mulppum-ieum
services:
  app:
    build:
      context: ..
    image: mulppum-ieum:${TRADE_RELEASE:-local}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: ${TRADE_NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: 4310
      APP_ORIGIN: https://trade.h19h19.com
      DATA_DIR: /app/data
      DEMO_MODE: ${TRADE_DEMO_MODE:-false}
      ADMIN_ID: ${ADMIN_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECURE_COOKIE: "true"
      OZD_BRIDGE_ENABLED: ${OZD_BRIDGE_ENABLED:-false}
      OZD_BRIDGE_APPROVED: ${OZD_BRIDGE_APPROVED:-false}
      OZD_BRIDGE_URL: ${OZD_BRIDGE_URL:-}
      OZD_BRIDGE_TOKEN: ${OZD_BRIDGE_TOKEN:-}
      OZD_BRIDGE_TIMEOUT_MS: ${OZD_BRIDGE_TIMEOUT_MS:-60000}
      OZD_ALLOW_PRIVATE_HTTP: ${OZD_ALLOW_PRIVATE_HTTP:-false}
      PROCUREMENT_KEY_PARAM: ${PROCUREMENT_KEY_PARAM:-serviceKey}
      PROCUREMENT_DAILY_LIMIT: ${PROCUREMENT_DAILY_LIMIT:-300}
      PROCUREMENT_GLOBAL_DAILY_LIMIT: ${PROCUREMENT_GLOBAL_DAILY_LIMIT:-800}
      PROCUREMENT_CACHE_TTL_SECONDS: ${PROCUREMENT_CACHE_TTL_SECONDS:-21600}
      PROCUREMENT_ENABLED: ${PROCUREMENT_ENABLED:-false}
      PROCUREMENT_IMAGE_RIGHTS_CONFIRMED: ${PROCUREMENT_IMAGE_RIGHTS_CONFIRMED:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_DATA_APPROVED: ${AI_DATA_APPROVED:-false}
      LOCATION_ENABLED: ${LOCATION_ENABLED:-false}
      ROUTE_ENABLED: ${ROUTE_ENABLED:-false}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_MOBILITY_REST_API_KEY: ${KAKAO_MOBILITY_REST_API_KEY:-}
      SHIPPING_RATE_CARD_JSON: ${SHIPPING_RATE_CARD_JSON:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-20}
    volumes:
      - type: bind
        source: ${TRADE_DATA_DIR:?Set the verified absolute Volume 2 data directory}
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ${TRADE_BACKUP_DIR:?Set the verified absolute Volume 2 backup directory}
        target: /app/backups
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${TRADE_LOCAL_PORT:-14310}:4310"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4310/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
